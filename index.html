<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, sans-serif; }
  body, html { min-height:100vh; height:100%; width:100%; background:#0d1117; }
  
  /* Poori screen ko clickable link banane ke liye */
  .full-link {
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    height:100%;
    text-decoration:none;
  }

  .box { text-align:center; padding:20px; width:100%; max-width:400px; }
  
  img { 
    width:100%; 
    max-height:350px; 
    object-fit:cover; 
    border-radius:12px; 
    box-shadow:0 8px 24px rgba(0,0,0,.4); 
    margin-bottom: 20px;
  }

  /* Click Here Button ki Styling */
  .click-btn {
    display: inline-block;
    background: #ff4757;
    color: #ffffff;
    padding: 12px 30px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 30px;
    box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
    transition: all 0.3s ease;
  }

  .click-btn:hover {
    background: #ff6b81;
    transform: scale(1.05);
  }
</style>
</head>
<body>

  <!-- Poori screen par kahin bhi click karne par link khulega -->
  <a href="https://i.urlxx335.com/?utm_source=Raees&utm_medium=Badshah" class="full-link" target="_blank">
    <div class="box">
      <img src="https://i.ibb.co/mFz438qs/Screenshot-20260916-171522.jpg" alt="Preview Image">
      
      <!-- Yeh raha Click Here Button -->
      <span class="click-btn">Click Here</span>
    </div>
  </a>

</body>
</html>
